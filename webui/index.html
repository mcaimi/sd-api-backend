<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SD API Backend</title>
  <link rel="stylesheet" href="vendor/patternfly/patternfly.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="pf-v5-c-masthead">
    <div class="pf-v5-c-masthead__main">
      <span class="pf-v5-c-masthead__brand">SD API Backend</span>
    </div>
  </header>

  <nav class="app-nav" aria-label="Primary">
    <a class="pf-v5-c-button pf-m-tertiary app-nav-link" data-tab="jobs" href="#jobs">Jobs</a>
    <a class="pf-v5-c-button pf-m-tertiary app-nav-link" data-tab="outputs" href="#outputs">Outputs</a>
    <a class="pf-v5-c-button pf-m-tertiary app-nav-link" data-tab="models" href="#models">Models</a>
    <a class="pf-v5-c-button pf-m-tertiary app-nav-link" data-tab="docs" href="#docs">API Docs</a>
    <a class="pf-v5-c-button pf-m-tertiary app-nav-link" data-tab="telemetry" href="#telemetry">Telemetry</a>
  </nav>

  <main class="pf-v5-c-page__main-section">
    <section id="tab-jobs" class="app-tab"></section>
    <section id="tab-outputs" class="app-tab"></section>
    <section id="tab-models" class="app-tab"></section>
    <section id="tab-docs" class="app-tab app-tab-docs">
      <iframe class="app-docs-frame" src="/docs" title="API Documentation"></iframe>
    </section>
    <section id="tab-telemetry" class="app-tab"></section>
  </main>

  <div id="modal-root"></div>

  <script src="js/api.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/outputs.js"></script>
  <script src="js/models.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
