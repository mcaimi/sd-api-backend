[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-api-backend"
version = "2.0.0"
description = "REST API for Stable Diffusion Image Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "metastable[telemetry]>=0.1.0",
  "pillow>=12.0.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "torch==2.15.0",
  "torchvision>=0.29",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["api"]
