[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-api-backend"
version = "1.0.0"
description = "REST API for Stable Diffusion image generation (SD1.5 and SDXL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.49.2",
    "diffusers==0.39",
    "fastapi>=0.115.0",
    "peft>=0.19.1",
    "pillow>=12.0.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "torch==2.13.0",
    "torchvision>=0.23.0",
    "transformers==5.13",
    "uvicorn[standard]>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]
