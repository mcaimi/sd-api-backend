[project]
name = "sd-api-backend"
version = "2.0.0"
description = "REST API for Stable Diffusion Image Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "metastable[telemetry]>=0.1.0",
  "pillow>=12.0.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.15.0", "torchvision>=0.29", "torchaudio"]
"rocm10.0" = ["torch>=2.15.0", "torchvision>=0.29", "triton-rocm", "torchaudio"]
cu132 = ["torch>=2.15.0", "torchvision>=0.29", "torchaudio"]
cu134 = ["torch>=2.15.0", "torchvision>=0.29", "torchaudio"]

[tool.uv]
conflicts = [
  [
    { extra = "rocm10.0" },
    { extra = "cu132" },
    { extra = "cu134" },
    { extra = "cpu" },
  ],
]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "cpu" },
  { index = "pytorch-cu132", marker = "sys_platform == 'linux'", extra = "cu132" },
  { index = "pytorch-cu134", marker = "sys_platform == 'linux'", extra = "cu134" },
  { index = "pytorch-rocm10.0", marker = "sys_platform == 'linux'", extra = "rocm10.0" },
]
triton-rocm = [
  { index = "pytorch-rocm10.0", marker = "sys_platform == 'linux'", extra = "rocm10.0" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "cpu" },
  { index = "pytorch-cu132", marker = "sys_platform == 'linux'", extra = "cu132" },
  { index = "pytorch-cu134", marker = "sys_platform == 'linux'", extra = "cu134" },
  { index = "pytorch-rocm10.0", marker = "sys_platform == 'linux'", extra = "rocm10.0" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "cpu" },
  { index = "pytorch-cu120", marker = "sys_platform == 'linux'", extra = "cu132" },
  { index = "pytorch-cu134", marker = "sys_platform == 'linux'", extra = "cu134" },
  { index = "pytorch-rocm10.0", marker = "sys_platform == 'linux'", extra = "rocm10.0" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm10.0"
url = "https://download.pytorch.org/whl/rocm10.0"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
